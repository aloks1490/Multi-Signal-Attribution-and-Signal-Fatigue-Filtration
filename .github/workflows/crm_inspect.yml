name: CRM inspect

# Lists Signal Engine tasks in HubSpot and the companies each is linked to (read-only).
# With "repair" ticked, first links existing tasks to their companies (associations only, no field changes).
on:
  workflow_dispatch:
    inputs:
      repair:
        description: "Link existing Signal Engine tasks to their companies first"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Repair task links
        if: ${{ inputs.repair }}
        run: uv run python -m activation.crm repair-tasks
      - run: uv run python -m activation.crm inspect
