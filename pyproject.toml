[project]
name = "signal-engine"
version = "0.1.0"
description = "GTM signal-fatigue scoring engine: decayed, pattern-based account scoring evaluated on synthetic data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "faker>=30",
    "numpy>=2.0",
    "pandas>=2.2",
    "dbt-core>=1.10,<1.12",
    "dbt-duckdb>=1.9,<1.11",
    "streamlit>=1.66.1",
    "plotly>=7.1.0",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator", "eval", "engine", "activation", "app"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
