version: 2

models:
  - name: account_daily_scores
    description: One row per account per score date (warm-up + evaluation window).
    columns:
      - name: account_id
        data_tests: [not_null]
      - name: score_date
        data_tests: [not_null]
      - name: engine_score
        data_tests: [not_null]
      - name: fit_grade
        data_tests:
          - accepted_values: {arguments: {values: ['A', 'B', 'C', 'D']}}

  - name: alert_candidates
    description: Every alerting decision per profile (engine/alerting.py).
    columns:
      - name: status
        data_tests:
          - accepted_values: {arguments: {values: ['alerted', 'cooldown', 'deferred', 'dropped', 'expired']}}
      - name: kind
        data_tests:
          - accepted_values: {arguments: {values: ['entry', 'jump', 'deferred']}}

  - name: engine_alerts
    columns:
      - name: profile
        data_tests:
          - accepted_values: {arguments: {values: ['precise', 'broad']}}
      - name: account_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('stg_accounts'), field: account_id}}
      - name: tier
        data_tests:
          - accepted_values: {arguments: {values: ['hot']}}

  - name: baseline_points_alerts
    columns:
      - name: account_id
        data_tests: [not_null]
      - name: profile
        data_tests:
          - accepted_values: {arguments: {values: ['precise', 'broad']}}

unit_tests:
  - name: t_u1_u2_u3_decay_and_point_in_time
    description: Weight 8, half-life 7 → 4.0 after 7 days, 2.0 after 14. An event at 00:00 on the score date is not visible yet.
    model: int_engagement_contrib
    given:
      - input: ref('events_clean')
        rows:
          - {event_id: e1, account_id: a1, person_key: c1, event_type: security_page, source: web, occurred_at: "2026-07-01 00:00:00", known_at: "2026-07-01 00:00:00", category: engagement, funnel_stage: BOFU, weight: 8, half_life_days: 7}
      - input: ref('date_spine')
        rows:
          - {score_date: "2026-07-01"}
          - {score_date: "2026-07-08"}
          - {score_date: "2026-07-15"}
      - input: ref('scoring_params')
        rows:
          - {param: lookback_days, value: "180"}
    expect:
      rows:
        - {account_id: a1, score_date: "2026-07-08", event_type: security_page, contribution: 4.0, n_events: 1}
        - {account_id: a1, score_date: "2026-07-15", event_type: security_page, contribution: 2.0, n_events: 1}

  - name: t_u3b_late_identity_not_used_before_known
    description: A cookie-stitched event that occurred on 1 Jul but was only attributable on 10 Jul counts from 11 Jul, aged from 1 Jul.
    model: int_engagement_contrib
    given:
      - input: ref('events_clean')
        rows:
          - {event_id: e1, account_id: a1, person_key: c1, event_type: pricing_page, source: web, occurred_at: "2026-07-01 00:00:00", known_at: "2026-07-10 12:00:00", category: engagement, funnel_stage: BOFU, weight: 5, half_life_days: 5}
      - input: ref('date_spine')
        rows:
          - {score_date: "2026-07-06"}
          - {score_date: "2026-07-11"}
      - input: ref('scoring_params')
        rows:
          - {param: lookback_days, value: "180"}
    expect:
      rows:
        - {account_id: a1, score_date: "2026-07-11", event_type: pricing_page, contribution: 1.25, n_events: 1}

  - name: t_u5_job_posts_and_cap
    description: Open post = full weight; closed 14 days ago = half; at most 3 open posts count; funding decays from its date.
    model: int_trigger_contrib
    given:
      - input: ref('triggers_clean')
        rows:
          - {event_id: t1, account_id: open1, trigger_type: sdr_job_post, occurred_at: "2026-06-01 00:00:00", closed_at: null, weight: 3, half_life_days: 14}
          - {event_id: t2, account_id: closed1, trigger_type: sdr_job_post, occurred_at: "2026-05-01 00:00:00", closed_at: "2026-06-17 00:00:00", weight: 3, half_life_days: 14}
          - {event_id: t3, account_id: many, trigger_type: sdr_job_post, occurred_at: "2026-06-01 00:00:00", closed_at: null, weight: 3, half_life_days: 14}
          - {event_id: t4, account_id: many, trigger_type: sdr_job_post, occurred_at: "2026-06-02 00:00:00", closed_at: null, weight: 3, half_life_days: 14}
          - {event_id: t5, account_id: many, trigger_type: sdr_job_post, occurred_at: "2026-06-03 00:00:00", closed_at: null, weight: 3, half_life_days: 14}
          - {event_id: t6, account_id: many, trigger_type: sdr_job_post, occurred_at: "2026-06-04 00:00:00", closed_at: null, weight: 3, half_life_days: 14}
          - {event_id: t7, account_id: funded, trigger_type: funding_round, occurred_at: "2026-04-17 00:00:00", closed_at: null, weight: 4, half_life_days: 75}
      - input: ref('date_spine')
        rows:
          - {score_date: "2026-07-01"}
      - input: ref('scoring_params')
        rows:
          - {param: lookback_days, value: "180"}
          - {param: max_open_job_posts, value: "3"}
    expect:
      rows:
        - {account_id: open1, score_date: "2026-07-01", trigger_type: sdr_job_post, contribution: 3.0, n_events: 1}
        - {account_id: closed1, score_date: "2026-07-01", trigger_type: sdr_job_post, contribution: 1.5, n_events: 1}
        - {account_id: many, score_date: "2026-07-01", trigger_type: sdr_job_post, contribution: 9.0, n_events: 3}
        - {account_id: funded, score_date: "2026-07-01", trigger_type: funding_round, contribution: 2.0, n_events: 1}

  - name: t_u8_engine_alerts_keeps_only_alerted
    description: Only "alerted" decisions reach engine_alerts; is_active follows active_profile; the reason comes from the day's score row.
    model: engine_alerts
    given:
      - input: ref('alert_candidates')
        rows:
          - {profile: broad, account_id: a1, score_date: "2026-07-03", status: alerted, kind: entry, engine_score: 40, owner_ae_id: ae_1}
          - {profile: broad, account_id: a2, score_date: "2026-07-03", status: deferred, kind: entry, engine_score: 30, owner_ae_id: ae_1}
          - {profile: precise, account_id: a1, score_date: "2026-07-05", status: alerted, kind: jump, engine_score: 80, owner_ae_id: ae_1}
          - {profile: precise, account_id: a3, score_date: "2026-07-05", status: cooldown, kind: entry, engine_score: 90, owner_ae_id: ae_2}
      - input: ref('account_daily_scores')
        rows:
          - {account_id: a1, score_date: "2026-07-03", top_signals: pricing_page, reason: "40 · fit A"}
          - {account_id: a1, score_date: "2026-07-05", top_signals: pricing_page, reason: "80 · fit A"}
          - {account_id: a2, score_date: "2026-07-03", top_signals: blog_visit, reason: "30 · fit B"}
      - input: ref('scoring_params')
        rows:
          - {param: active_profile, value: broad}
    expect:
      rows:
        - {profile: broad, is_active: true, account_id: a1, alert_date: "2026-07-03", alert_kind: entry, reason: "40 · fit A"}
        - {profile: precise, is_active: false, account_id: a1, alert_date: "2026-07-05", alert_kind: jump, reason: "80 · fit A"}

  - name: t_u9_pattern_multipliers
    description: >
      solo = 1 person with BOFU → breadth 0.7, no spike (needs 2 people).
      team = 3 people, 2 sources, 3 events this week vs none before → 1.3, 1.15, spike 1.2.
      binger = MOFU only → no boosts, gate 0.6.
      stitched = an anonymous visit stitched to c9 only after the score date still counts as a separate person.
    model: int_pattern_metrics
    given:
      - input: ref('events_clean')
        rows:
          - {account_id: solo, person_key: p1, observed_key: p1, person_known_at: "2026-07-10 10:00:00", event_type: pricing_page, source: web, funnel_stage: BOFU, occurred_at: "2026-07-10 10:00:00", known_at: "2026-07-10 11:00:00", category: engagement, weight: 5}
          - {account_id: team, person_key: p1, observed_key: p1, person_known_at: "2026-07-12 10:00:00", event_type: pricing_page, source: web, funnel_stage: BOFU, occurred_at: "2026-07-12 10:00:00", known_at: "2026-07-12 11:00:00", category: engagement, weight: 5}
          - {account_id: team, person_key: p2, observed_key: p2, person_known_at: "2026-07-12 10:00:00", event_type: integration_page, source: web, funnel_stage: MOFU, occurred_at: "2026-07-12 10:00:00", known_at: "2026-07-12 11:00:00", category: engagement, weight: 3}
          - {account_id: team, person_key: p3, observed_key: p3, person_known_at: "2026-07-13 10:00:00", event_type: email_click, source: marketing, funnel_stage: MOFU, occurred_at: "2026-07-13 10:00:00", known_at: "2026-07-13 10:00:00", category: engagement, weight: 1.5}
          - {account_id: binger, person_key: m1, observed_key: m1, person_known_at: "2026-07-12 10:00:00", event_type: content_download, source: marketing, funnel_stage: MOFU, occurred_at: "2026-07-12 10:00:00", known_at: "2026-07-12 10:00:00", category: engagement, weight: 2}
          - {account_id: binger, person_key: m2, observed_key: m2, person_known_at: "2026-07-12 10:00:00", event_type: content_download, source: marketing, funnel_stage: MOFU, occurred_at: "2026-07-12 10:00:00", known_at: "2026-07-12 10:00:00", category: engagement, weight: 2}
          - {account_id: stitched, person_key: c9, observed_key: "anon:x", person_known_at: "2026-07-20 10:00:00", event_type: pricing_page, source: web, funnel_stage: BOFU, occurred_at: "2026-07-10 10:00:00", known_at: "2026-07-10 11:00:00", category: engagement, weight: 5}
          - {account_id: stitched, person_key: c9, observed_key: c9, person_known_at: "2026-07-11 10:00:00", event_type: pricing_page, source: web, funnel_stage: BOFU, occurred_at: "2026-07-11 10:00:00", known_at: "2026-07-11 11:00:00", category: engagement, weight: 5}
      - input: ref('date_spine')
        rows:
          - {score_date: "2026-07-15"}
      - input: ref('pattern_multipliers')
        rows:
          - {multiplier: breadth, min_value: 0, max_value: 2, value: 0.7}
          - {multiplier: breadth, min_value: 2, max_value: 3, value: 1.0}
          - {multiplier: breadth, min_value: 3, max_value: 4, value: 1.3}
          - {multiplier: breadth, min_value: 4, max_value: 1000000, value: 1.5}
          - {multiplier: sources, min_value: 0, max_value: 2, value: 1.0}
          - {multiplier: sources, min_value: 2, max_value: 3, value: 1.15}
          - {multiplier: sources, min_value: 3, max_value: 1000000, value: 1.3}
          - {multiplier: spike, min_value: 0, max_value: 2, value: 1.0}
          - {multiplier: spike, min_value: 2, max_value: 4, value: 1.2}
          - {multiplier: spike, min_value: 4, max_value: 8, value: 1.5}
          - {multiplier: spike, min_value: 8, max_value: 1000000, value: 1.8}
      - input: ref('scoring_params')
        rows:
          - {param: spike_min_people, value: "2"}
          - {param: no_bofu_multiplier, value: "0.6"}
    expect:
      rows:
        - {account_id: solo, people_14d: 1, m_breadth: 0.7, m_sources: 1.0, m_spike: 1.0, m_gate: 1.0}
        - {account_id: team, people_14d: 3, m_breadth: 1.3, m_sources: 1.15, m_spike: 1.2, m_gate: 1.0}
        - {account_id: binger, people_14d: 2, m_breadth: 1.0, m_sources: 1.0, m_spike: 1.0, m_gate: 0.6}
        - {account_id: stitched, people_14d: 2, m_breadth: 1.0, m_sources: 1.0, m_spike: 1.2, m_gate: 1.0}

  - name: t_u10_combos
    description: >
      evaluation needs two people; one person browsing both pages is not a committee.
      Trigger combos need engagement: triggers alone earn nothing.
    model: int_combo_matches
    given:
      - input: ref('events_clean')
        rows:
          - {account_id: eval2, person_key: p1, observed_key: p1, person_known_at: "2026-07-10 10:00:00", event_type: pricing_page, funnel_stage: BOFU, occurred_at: "2026-07-10 10:00:00", known_at: "2026-07-10 11:00:00", category: engagement, weight: 5}
          - {account_id: eval2, person_key: p2, observed_key: p2, person_known_at: "2026-07-11 10:00:00", event_type: security_page, funnel_stage: BOFU, occurred_at: "2026-07-11 10:00:00", known_at: "2026-07-11 11:00:00", category: engagement, weight: 6}
          - {account_id: eval1, person_key: p1, observed_key: p1, person_known_at: "2026-07-10 10:00:00", event_type: pricing_page, funnel_stage: BOFU, occurred_at: "2026-07-10 10:00:00", known_at: "2026-07-10 11:00:00", category: engagement, weight: 5}
          - {account_id: eval1, person_key: p1, observed_key: p1, person_known_at: "2026-07-11 10:00:00", event_type: security_page, funnel_stage: BOFU, occurred_at: "2026-07-11 10:00:00", known_at: "2026-07-11 11:00:00", category: engagement, weight: 6}
          - {account_id: trial, person_key: u1, observed_key: u1, person_known_at: "2026-07-05 10:00:00", event_type: trial_started, funnel_stage: MOFU, occurred_at: "2026-07-05 10:00:00", known_at: "2026-07-05 10:00:00", category: engagement, weight: 3}
          - {account_id: trial, person_key: u1, observed_key: u1, person_known_at: "2026-07-09 10:00:00", event_type: teammate_invited, funnel_stage: BOFU, occurred_at: "2026-07-09 10:00:00", known_at: "2026-07-09 10:00:00", category: engagement, weight: 6}
          - {account_id: trig_eng, person_key: p1, observed_key: p1, person_known_at: "2026-07-10 10:00:00", event_type: pricing_page, funnel_stage: BOFU, occurred_at: "2026-07-10 10:00:00", known_at: "2026-07-10 11:00:00", category: engagement, weight: 5}
      - input: ref('triggers_clean')
        rows:
          - {event_id: t1, account_id: trig_only, trigger_type: new_sales_leader, occurred_at: "2026-06-01 00:00:00", weight: 5, half_life_days: 60}
          - {event_id: t2, account_id: trig_only, trigger_type: sdr_job_post, occurred_at: "2026-06-05 00:00:00", weight: 3, half_life_days: 14}
          - {event_id: t3, account_id: trig_eng, trigger_type: new_sales_leader, occurred_at: "2026-06-01 00:00:00", weight: 5, half_life_days: 60}
          - {event_id: t4, account_id: trig_eng, trigger_type: sdr_job_post, occurred_at: "2026-06-05 00:00:00", weight: 3, half_life_days: 14}
      - input: ref('date_spine')
        rows:
          - {score_date: "2026-07-15"}
      - input: ref('combo_rules')
        rows:
          - {combo: evaluation, window_days: 14, bonus: 10}
          - {combo: team_trial, window_days: 14, bonus: 10}
          - {combo: sales_build, window_days: 60, bonus: 8}
          - {combo: trigger_then_intent, window_days: 60, bonus: 6}
    expect:
      rows:
        - {account_id: eval2, combo: evaluation, bonus: 10}
        - {account_id: trial, combo: team_trial, bonus: 10}
        - {account_id: trig_eng, combo: sales_build, bonus: 8}
        - {account_id: trig_eng, combo: trigger_then_intent, bonus: 6}
